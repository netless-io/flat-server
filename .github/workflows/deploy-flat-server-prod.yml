name: Deploy Flat Server Production

on:
  workflow_dispatch:
    inputs:
      ssh_host:
        description: "Override SSH host. Leave empty to use secrets.SSH_HOST."
        required: false
        type: string
      ssh_port:
        description: "Override SSH port. Leave empty to use secrets.SSH_PORT."
        required: false
        type: string
      bind_address:
        description: "Bind address for host port mapping. Default is 127.0.0.1 for Caddy gateway usage."
        required: false
        type: string
      port:
        description: "Host port exposed for flat-server. Default is 8761."
        required: false
        type: string
      container_port:
        description: "Container port flat-server listens on. Default is 8761 and should match server.port in production.local.yaml."
        required: false
        type: string
      docker_network:
        description: "Optional Docker network name. Use this if billing should reach flat-server over container network."
        required: false
        type: string
      skip_build:
        description: "Skip build/push and deploy an existing immutable image tag."
        required: false
        type: boolean
        default: false
      image_tag:
        description: "Required when skip_build=true. Use a commit SHA previously pushed to GHCR."
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  deploy-flat-server-prod:
    concurrency:
      group: flat-server-production
      cancel-in-progress: false
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name to lowercase
        id: image
        run: |
          echo "IMAGE_NAME=$(echo ghcr.io/${{ github.repository_owner }}/flat-server | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Resolve immutable image tag
        id: deploy_tag
        run: |
          if [ "${{ github.event.inputs.skip_build }}" = "true" ]; then
            if [ -z "${{ github.event.inputs.image_tag }}" ]; then
              echo "image_tag is required when skip_build=true" >&2
              exit 1
            fi
            echo "value=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: ${{ github.event.inputs.skip_build != 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: ${{ github.event.inputs.skip_build != 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.IMAGE_NAME }}:latest
            ${{ steps.image.outputs.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ github.event.inputs.ssh_host || secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ github.event.inputs.ssh_port || secrets.SSH_PORT }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            CONTAINER_NAME="flat-server"
            PREVIOUS_CONTAINER_NAME="flat-server-previous"
            CANDIDATE_CONTAINER_NAME="flat-server-candidate"
            PORT_INPUT="${{ github.event.inputs.port }}"
            PORT="${PORT_INPUT:-8761}"
            CONTAINER_PORT_INPUT="${{ github.event.inputs.container_port }}"
            CONTAINER_PORT="${CONTAINER_PORT_INPUT:-8761}"
            BIND_ADDRESS_INPUT="${{ github.event.inputs.bind_address }}"
            BIND_ADDRESS="${BIND_ADDRESS_INPUT:-127.0.0.1}"
            DOCKER_NETWORK_INPUT="${{ github.event.inputs.docker_network }}"
            DOCKER_NETWORK="${DOCKER_NETWORK_INPUT:-}"
            CONFIG_B64="${{ secrets.FLAT_SERVER_CONFIG_YAML_B64 }}"
            IMAGE_NAME="${{ steps.image.outputs.IMAGE_NAME }}:${{ steps.deploy_tag.outputs.value }}"

            if [ -z "$CONFIG_B64" ]; then
              echo "Missing production environment secret: FLAT_SERVER_CONFIG_YAML_B64" >&2
              exit 1
            fi

            SUDO=""
            if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
              SUDO="sudo -n"
            fi

            DOCKER_BIN="$(command -v docker || true)"
            if [ -z "$DOCKER_BIN" ]; then
              for candidate in /usr/bin/docker /usr/local/bin/docker /bin/docker; do
                if [ -x "$candidate" ]; then
                  DOCKER_BIN="$candidate"
                  break
                fi
              done
            fi
            if [ -z "$DOCKER_BIN" ]; then
              echo "docker not found on server. Please install Docker." >&2
              exit 1
            fi
            DOCKER="$DOCKER_BIN"
            if [ -n "$SUDO" ]; then
              DOCKER="$SUDO $DOCKER_BIN"
            fi

            echo "Logging in to ghcr.io..."
            for i in 1 2 3; do
              if echo "${{ secrets.GIT_TOKEN }}" | $DOCKER login ghcr.io -u ${{ github.actor }} --password-stdin; then
                break
              fi
              if [ "$i" -eq 3 ]; then
                echo "Failed to docker login ghcr.io after retries." >&2
                exit 1
              fi
              sleep 3
            done

            echo "Pulling image from ghcr.io..."
            for i in 1 2 3 4 5; do
              if $DOCKER pull "$IMAGE_NAME"; then
                break
              fi
              if [ "$i" -eq 5 ]; then
                echo "Failed to pull image from ghcr.io after retries." >&2
                exit 1
              fi
              sleep $((i * 3))
            done

            DOCKER_RUN_ARGS=""
            if [ -n "$DOCKER_NETWORK" ]; then
              DOCKER_RUN_ARGS="--network $DOCKER_NETWORK"
            fi

            $DOCKER rm -f "$CANDIDATE_CONTAINER_NAME" >/dev/null 2>&1 || true
            $DOCKER run -d \
              -p "127.0.0.1::${CONTAINER_PORT}" \
              -e NODE_ENV=production \
              -e FLAT_SERVER_CONFIG_YAML_B64="$CONFIG_B64" \
              ${DOCKER_RUN_ARGS} \
              --name "$CANDIDATE_CONTAINER_NAME" \
              "$IMAGE_NAME"

            CANDIDATE_PORT="$($DOCKER port "$CANDIDATE_CONTAINER_NAME" "${CONTAINER_PORT}/tcp" | head -n1 | awk -F: '{print $NF}')"
            if [ -z "$CANDIDATE_PORT" ]; then
              echo "Failed to resolve candidate host port." >&2
              $DOCKER logs "$CANDIDATE_CONTAINER_NAME" || true
              exit 1
            fi
            CANDIDATE_READY="false"
            for i in $(seq 1 30); do
              if curl --fail --silent --show-error "http://127.0.0.1:${CANDIDATE_PORT}/health-check" >/dev/null; then
                CANDIDATE_READY="true"
                break
              fi
              sleep 2
            done
            if [ "$CANDIDATE_READY" != "true" ]; then
              echo "Candidate flat-server failed health check." >&2
              $DOCKER logs "$CANDIDATE_CONTAINER_NAME" || true
              $DOCKER rm -f "$CANDIDATE_CONTAINER_NAME" || true
              exit 1
            fi
            $DOCKER rm -f "$CANDIDATE_CONTAINER_NAME"

            $DOCKER rm -f "$PREVIOUS_CONTAINER_NAME" >/dev/null 2>&1 || true
            if $DOCKER ps -a --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
              $DOCKER rename "$CONTAINER_NAME" "$PREVIOUS_CONTAINER_NAME"
              $DOCKER stop "$PREVIOUS_CONTAINER_NAME"
            fi

            if ! $DOCKER run -d \
              -p "${BIND_ADDRESS}:${PORT}:${CONTAINER_PORT}" \
              -e NODE_ENV=production \
              -e FLAT_SERVER_CONFIG_YAML_B64="$CONFIG_B64" \
              --restart unless-stopped \
              ${DOCKER_RUN_ARGS} \
              --name "$CONTAINER_NAME" \
              "$IMAGE_NAME"; then
              echo "New flat-server failed to start; restoring previous container." >&2
              $DOCKER rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
              if $DOCKER ps -a --format '{{.Names}}' | grep -q "^${PREVIOUS_CONTAINER_NAME}$"; then
                $DOCKER rename "$PREVIOUS_CONTAINER_NAME" "$CONTAINER_NAME"
                $DOCKER start "$CONTAINER_NAME"
              fi
              exit 1
            fi

            HEALTH_ADDRESS="$BIND_ADDRESS"
            if [ "$HEALTH_ADDRESS" = "0.0.0.0" ]; then
              HEALTH_ADDRESS="127.0.0.1"
            fi
            READY="false"
            for i in $(seq 1 30); do
              if curl --fail --silent --show-error "http://${HEALTH_ADDRESS}:${PORT}/health-check" >/dev/null; then
                READY="true"
                break
              fi
              sleep 2
            done
            if [ "$READY" != "true" ]; then
              echo "New flat-server failed final health check; restoring previous container." >&2
              $DOCKER logs "$CONTAINER_NAME" || true
              $DOCKER rm -f "$CONTAINER_NAME" || true
              if $DOCKER ps -a --format '{{.Names}}' | grep -q "^${PREVIOUS_CONTAINER_NAME}$"; then
                $DOCKER rename "$PREVIOUS_CONTAINER_NAME" "$CONTAINER_NAME"
                $DOCKER start "$CONTAINER_NAME"
              fi
              exit 1
            fi

            echo "Deployed immutable image: $IMAGE_NAME"
            $DOCKER image prune -f
